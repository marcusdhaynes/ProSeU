name: Jurisprudence lesson player integration

on:
  pull_request:
    paths:
      - 'src/app/learn/**'
      - 'src/components/learn/lesson/**'
      - 'src/components/admin/templates/Veritas.tsx'
      - 'src/components/admin/templates/Multiplix.tsx'
      - 'src/components/admin/templates/Congruens.tsx'
      - 'src/lib/lesson-*'
      - 'src/learning/**'
      - 'lessons/stage-01/PSU-1.1/**'
      - '.github/workflows/jurisprudence-lesson-player.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies despite inherited lockfile mismatch
        run: npm install --no-save --no-package-lock --no-audit --no-fund
      - name: Check dedicated mastery and lesson tests
        run: node --import tsx --test src/learning/learning.test.ts src/learning/draft-practice.test.ts src/lib/lesson-adapter.test.ts src/lib/lesson-progress.test.ts
      - name: Build app including Learn page and lesson player
        run: npm run build:web
