name: Supabase data migration checks
on:
  pull_request:
    paths:
      - 'src/**'
      - 'supabase/**'
      - 'scripts/check-supabase-data-migration.mjs'
      - '.github/workflows/supabase-migration.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - run: npm install --no-audit --no-fund
      - name: Check migration boundary
        run: node scripts/check-supabase-data-migration.mjs
      - name: Build web app
        run: npm run build:web
        env:
          GITHUB_PAGES: 'true'
